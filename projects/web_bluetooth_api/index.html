<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 · BLE Control Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="panel">

    <!-- Заголовок устройства -->
    <header class="panel__header">
      <div class="device-id">
        <span class="device-id__eyebrow">Device</span>
        <h1 class="device-id__name">ESP32_Demo_Device</h1>
      </div>
      <div class="link-status" id="linkStatus" data-state="offline">
        <span class="link-status__led"></span>
        <span class="link-status__text" id="linkStatusText">Offline</span>
      </div>
    </header>

    <!-- Экран-читаемое устройство (визуальное продолжение OLED-дисплея платы) -->
    <section class="readout">
      <div class="readout__label">Last button event</div>
      <div class="readout__screen" id="eventScreen" data-empty="true">
        <span class="readout__value" id="eventValue">— NO EVENT —</span>
        <span class="readout__meta" id="eventMeta">Waiting for connection</span>
      </div>
    </section>

    <!-- Подключение -->
    <section class="controls">
      <div class="controls__row">
        <button class="btn btn--primary" id="connectBtn">Connect device</button>
        <button class="btn btn--ghost" id="disconnectBtn" disabled>Disconnect</button>
      </div>

      <div class="controls__group">
        <span class="controls__group-label">Onboard LED</span>
        <div class="controls__row">
          <button class="btn btn--led-on" id="ledOnBtn" disabled>Turn on</button>
          <button class="btn btn--led-off" id="ledOffBtn" disabled>Turn off</button>
        </div>
      </div>
    </section>

    <!-- Консоль событий -->
    <section class="console">
      <div class="console__header">
        <span>Event log</span>
        <button class="console__clear" id="clearLogBtn">Clear</button>
      </div>
      <div class="console__body" id="logContent"></div>
    </section>

    <p class="hint" id="compatHint" hidden>
      Web Bluetooth недоступен в этом браузере. Откройте страницу в Chrome, Edge или Opera на компьютере или Android.
    </p>

  </main>

<script src="script.js"></script>
</body>
</html>
