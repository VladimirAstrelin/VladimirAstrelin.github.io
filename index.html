<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Virtual Lab</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <aside class="sidebar">

            <h2>Virtual Lab</h2>

            <button onclick="loadProject('projects/web_serial_api/index.html')">
                Web Serial API
            </button>

            <button onclick="loadProject('projects/web_bluetooth_api/index.html')">
                Web Bluetooth API
            </button>

            <button onclick="loadProject('projects/file_system_access_api_editor/index.html')">
                Browser Notepad
            </button>

            <button onclick="loadProject('projects/file_system_access_api_explorer/index.html')">
                Browser Explorer
            </button>

        </aside>

        <main class="content">

            <div id="welcomeScreen" class="welcome-screen">
                <div class="welcome-content">
                    <h1>🧪 Virtual Lab</h1>
                    <p class="subtitle">Експериментальні Web API проекти</p>
                    
                    <div class="features">
                        <div class="feature-card">
                            <span class="icon">🔌</span>
                            <h3>Web Serial API</h3>
                            <p>Взаємодія з послідовними портами</p>
                        </div>
                        
                        <div class="feature-card">
                            <span class="icon">📡</span>
                            <h3>Web Bluetooth API</h3>
                            <p>Підключення до Bluetooth пристроїв</p>
                        </div>
                        
                        <div class="feature-card">
                            <span class="icon">📝</span>
                            <h3>File System API</h3>
                            <p>Робота з локальними файлами</p>
                        </div>
                    </div>
                    
                    <p class="instruction">👈 Оберіть проект з меню зліва</p>
                </div>
            </div>

            <iframe
                id="projectFrame"
                src=""
                frameborder="0"
                style="display: none;">
            </iframe>

        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
