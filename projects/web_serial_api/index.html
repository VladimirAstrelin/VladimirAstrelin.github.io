<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 ESP WEB</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1>
                    <i class="fas fa-microchip"></i>
                    ESP32 Web Control
                </h1>
            </div>
            <div class="header-right">
                <div id="statusIndicator" class="status-indicator disconnected">
                    <div class="status-dot"></div>
                    <span id="statusText">Отключено</span>
                </div>
                <button id="connectBtn" class="btn btn-primary">
                    <i class="fas fa-plug"></i> Подключить
                </button>
                <button id="disconnectBtn" class="btn btn-danger" disabled>
                    <i class="fas fa-times"></i> Отключить
                </button>
            </div>
        </header>

        <main>
            <div class="left-column">
                <!-- Отправка текста на дисплей -->
                <div class="card">
                    <div class="card-title">
                        <i class="fas fa-tv"></i>
                        Текст на дисплей
                    </div>
                    <div class="form-group">
                        <label for="displayInput">Введите текст (макс. 16 символов):</label>
                        <div class="input-group">
                            <input 
                                type="text" 
                                id="displayInput" 
                                maxlength="16" 
                                placeholder="Привет мир!"
                                disabled
                            >
                            <button id="sendBtn" class="btn btn-success" disabled>
                                <i class="fas fa-paper-plane"></i> Отправить
                            </button>
                        </div>
                        <div class="char-counter">
                            Символов: <span id="charCount">0</span> / 16
                        </div>
                    </div>
                </div>

                <!-- Управление LED -->
                <div class="card">
                    <div class="card-title">
                        <i class="fas fa-lightbulb"></i>
                        Управление LED
                    </div>
                    <div class="led-control">
                        <div class="led-visual" id="ledVisual">
                            <i class="fas fa-power-off"></i>
                        </div>
                        
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="ledMode" value="off" checked disabled>
                                <span><i class="fas fa-circle"></i> Выключить</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="ledMode" value="on" disabled>
                                <span><i class="fas fa-sun"></i> Включить</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="ledMode" value="blink" disabled>
                                <span><i class="fas fa-bolt"></i> Мигание</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="ledMode" value="breath" disabled>
                                <span><i class="fas fa-wind"></i> Дыхание</span>
                            </label>
                        </div>

                        <div class="frequency-control">
                            <label for="frequencySlider">
                                Частота мигания: <strong id="frequencyValue">500</strong> мс
                            </label>
                            <input 
                                type="range" 
                                id="frequencySlider" 
                                min="100" 
                                max="2000" 
                                value="500" 
                                step="100"
                                disabled
                            >
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-column">
                <!-- Лог событий -->
                <div class="card log-card">
                    <div class="card-title">
                        <i class="fas fa-list"></i>
                        Лог событий
                        <button id="clearBtn" class="btn btn-warning" style="margin-left: auto; padding: 8px 16px;">
                            <i class="fas fa-trash"></i> Очистить
                        </button>
                    </div>
                    <div id="logDiv" class="log-container"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
